# ==========================================================
# 測試環境專用設定 (H2 In-Memory)
# ==========================================================

# 1. 強制切換為 H2 資料庫 (忽略任何環境變數)
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# 2. JPA 方言必須改回 H2 (否則 SQL 語法會報錯)
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop

# 3. 初始化設定
# 測試時依然執行 data.sql 來檢查資料邏輯
spring.sql.init.mode=never
spring.jpa.defer-datasource-initialization=false

# 4. 偽造安全性金鑰 (測試環境不需要真實 Secret，但必須存在，否則啟動會報錯)
jwt.secret=this_is_a_dummy_secret_for_test_purposes_only_32_characters
app.frontend.success-url=http://localhost:5173/home
app.frontend.register-url=http://localhost:5173/signup/user

# 5. 略過 OAuth 2.0 檢查 (避免啟動時因為沒有 Client ID 而報錯)
# 這樣測試 Context 就不會去驗證 Google 的設定是否有效
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.oauth2.client.servlet.OAuth2ClientAutoConfiguration

# 6. 其他設定
spring.main.allow-bean-definition-overriding=true