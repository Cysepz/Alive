spring.application.name=alive
spring.profiles.active=local

# --- 應用程式基本設定 ---
app.version=1.0.0-PROD
app.is-prod=${APP_IS_PROD:false}
# 從 Azure 環境變數 APP_CORS_ALLOWED_ORIGINS 讀取
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173}

# --- H2 資料庫連線設定 (線上版建議維持 H2 或改用 Azure MySQL) ---
# spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
# spring.datasource.driver-class-name=org.h2.Driver
# spring.datasource.username=sa
# spring.datasource.password=

# --- Azure MySQL 資料庫連線設定
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

# Azure MySQL 必須強制使用 SSL
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# --- JPA / Hibernate 設定 ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true


# --- H2 Console 設定 (線上版建議關閉，或僅供調試使用) ---
# spring.h2.console.enabled=true
# spring.h2.console.path=/h2-console
# spring.mvc.pathmatch.matching-strategy=ant_path_matcher
# spring.h2.console.settings.web-allow-others=true

# --- 自動初始化資料 ---
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=${SPRING_SQL_INIT_MODE:never}

# --- JWT 設定 (從 Azure 環境變數 JWT_SECRET 讀取) ---
jwt.secret=${JWT_SECRET}
jwt.expirationTime=86400000

# --- Google OAuth 2.0 設定 (從 Azure 環境變數讀取) ---
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=profile,email

# --- 前端跳轉路徑 (從 Azure 環境變數讀取) ---
app.frontend.success-url=${APP_FRONTEND_SUCCESS_URL:http://localhost:5173/home}
app.frontend.register-url=${APP_FRONTEND_REGISTER_URL:http://localhost:5173/signup/user}

# 允許 Bean 覆蓋
spring.main.allow-bean-definition-overriding=true